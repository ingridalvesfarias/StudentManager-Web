<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Novo aluno')}"></head>
<body>
    <header th:replace="~{fragments/layout :: cabecalho}"></header>

    <main>
        <h1>Cadastrar aluno</h1>

        <div class="card">
            <form th:action="@{/alunos}" th:object="${alunoForm}" method="post">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" th:field="*{nome}">
                    <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input type="number" th:field="*{idade}">
                    <span class="erro-campo" th:if="${#fields.hasErrors('idade')}" th:errors="*{idade}"></span>
                </div>

                <div class="campo">
                    <label for="matricula">Matrícula</label>
                    <input type="text" th:field="*{matricula}">
                    <span class="erro-campo" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}"></span>
                </div>

                <div class="campo">
                    <label for="curso">Curso/turma</label>
                    <input type="text" th:field="*{curso}">
                    <span class="erro-campo" th:if="${#fields.hasErrors('curso')}" th:errors="*{curso}"></span>
                </div>

                <div class="form-acoes">
                    <button type="submit">Cadastrar</button>
                    <a th:href="@{/alunos}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
