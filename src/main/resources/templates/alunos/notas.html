<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar nota')}"></head>
<body>
    <header th:replace="~{fragments/layout :: cabecalho}"></header>

    <main>
        <h1>Registrar nota</h1>

        <div class="card">
            <p>
                <strong>Aluno:</strong> <span th:text="${aluno.nome}">Nome</span>
                (matrícula <span th:text="${aluno.matricula}">2024001</span>)
            </p>
            <p><strong>Notas atuais:</strong> <span th:text="${aluno.notas}">[]</span></p>
        </div>

        <p class="mensagem" th:if="${mensagem}" th:text="${mensagem}"></p>

        <div class="card">
            <form th:action="@{/alunos/{matricula}/notas(matricula=${aluno.matricula})}"
                  th:object="${notaForm}" method="post">

                <p class="erro" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>

                <div class="campo">
                    <label for="nota">Nota (0 a 10)</label>
                    <input type="number" step="0.1" min="0" max="10" th:field="*{nota}">
                    <span class="erro-campo" th:if="${#fields.hasErrors('nota')}" th:errors="*{nota}"></span>
                </div>

                <div class="form-acoes">
                    <button type="submit">Registrar nota</button>
                    <a th:href="@{/alunos}">Voltar à lista</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
