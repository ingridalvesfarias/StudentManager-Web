<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar nota - Student Manager</title>
</head>
<body>
    <h1>Registrar nota</h1>

    <p>
        <strong>Aluno:</strong> <span th:text="${aluno.nome}">Nome</span>
        (matrícula <span th:text="${aluno.matricula}">2024001</span>)
    </p>
    <p><strong>Notas atuais:</strong> <span th:text="${aluno.notas}">[]</span></p>

    <p th:if="${mensagem}" th:text="${mensagem}"></p>

    <form th:action="@{/alunos/{matricula}/notas(matricula=${aluno.matricula})}"
          th:object="${notaForm}" method="post">

        <p th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>

        <p>
            <label for="nota">Nota (0 a 10)</label><br>
            <input type="number" step="0.1" min="0" max="10" th:field="*{nota}">
            <span th:if="${#fields.hasErrors('nota')}" th:errors="*{nota}"></span>
        </p>

        <button type="submit">Registrar nota</button>
        <a th:href="@{/alunos}">Voltar à lista</a>
    </form>
</body>
</html>
