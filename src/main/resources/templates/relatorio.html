<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório geral - Student Manager</title>
</head>
<body>
    <h1>Relatório geral da turma</h1>

    <table border="1" cellpadding="6">
        <tr>
            <th>Total de alunos</th>
            <td th:text="${relatorio.totalAlunos()}">0</td>
        </tr>
        <tr>
            <th>Alunos avaliados</th>
            <td th:text="${relatorio.avaliados()}">0</td>
        </tr>
        <tr>
            <th>Aprovados</th>
            <td th:text="${relatorio.aprovados()}">0</td>
        </tr>
        <tr>
            <th>Em recuperação</th>
            <td th:text="${relatorio.emRecuperacao()}">0</td>
        </tr>
        <tr>
            <th>Reprovados</th>
            <td th:text="${relatorio.reprovados()}">0</td>
        </tr>
        <tr>
            <th>Média geral da turma</th>
            <td th:text="${#numbers.formatDecimal(relatorio.mediaGeral(), 1, 2)}">0,00</td>
        </tr>
    </table>

    <p th:if="${relatorio.avaliados() < relatorio.totalAlunos()}">
        Alunos com menos de
        <span th:text="${T(studentmanager.model.Aluno).MIN_NOTAS}">2</span>
        notas não entram nas médias.
    </p>

    <p><a th:href="@{/alunos}">Ver alunos</a> | <a th:href="@{/}">Voltar ao início</a></p>
</body>
</html>
