<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Relatório')}"></head>
<body>
    <header th:replace="~{fragments/layout :: cabecalho}"></header>

    <main>
        <h1>Relatório geral da turma</h1>

        <div class="resumo">
            <div class="item">
                <span class="numero" th:text="${relatorio.totalAlunos()}">0</span>
                <span class="rotulo">Total de alunos</span>
            </div>
            <div class="item">
                <span class="numero" th:text="${relatorio.avaliados()}">0</span>
                <span class="rotulo">Alunos avaliados</span>
            </div>
            <div class="item">
                <span class="numero" th:text="${relatorio.aprovados()}">0</span>
                <span class="rotulo">Aprovados</span>
            </div>
            <div class="item">
                <span class="numero" th:text="${relatorio.emRecuperacao()}">0</span>
                <span class="rotulo">Em recuperação</span>
            </div>
            <div class="item">
                <span class="numero" th:text="${relatorio.reprovados()}">0</span>
                <span class="rotulo">Reprovados</span>
            </div>
            <div class="item">
                <span class="numero" th:text="${#numbers.formatDecimal(relatorio.mediaGeral(), 1, 2)}">0,00</span>
                <span class="rotulo">Média geral da turma</span>
            </div>
        </div>

        <p class="aviso" th:if="${relatorio.avaliados() < relatorio.totalAlunos()}">
            Alunos com menos de
            <span th:text="${T(studentmanager.model.Aluno).MIN_NOTAS}">2</span>
            notas não entram nas médias.
        </p>

        <p><a class="botao botao-secundario" th:href="@{/alunos}">Ver alunos</a></p>
    </main>
</body>
</html>
