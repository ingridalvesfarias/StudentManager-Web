<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar aluno')}"></head>
<body>
    <header th:replace="~{fragments/layout :: cabecalho}"></header>

    <main>
        <h1>Editar aluno</h1>

        <div class="card">
            <p>
                <strong>Matrícula:</strong> <span th:text="${aluno.matricula}">2024001</span>
                (não pode ser alterada)
            </p>

            <form th:action="@{/alunos/{matricula}/editar(matricula=${aluno.matricula})}"
                  th:object="${editarAlunoForm}" method="post">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" th:field="*{nome}">
                    <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input type="number" th:field="*{idade}">
                    <span class="erro-campo" th:if="${#fields.hasErrors('idade')}" th:errors="*{idade}"></span>
                </div>

                <div class="campo">
                    <label for="curso">Curso/turma</label>
                    <input type="text" th:field="*{curso}">
                    <span class="erro-campo" th:if="${#fields.hasErrors('curso')}" th:errors="*{curso}"></span>
                </div>

                <div class="form-acoes">
                    <button type="submit">Salvar alterações</button>
                    <a th:href="@{/alunos}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
