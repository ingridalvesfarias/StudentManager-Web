<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Início')}"></head>
<body>
    <header th:replace="~{fragments/layout :: cabecalho}"></header>

    <main>
        <div class="card">
            <h1 th:text="${titulo}">Student Manager</h1>
            <p>Sistema de gerenciamento escolar rodando na web!</p>
            <p>Alunos cadastrados: <strong th:text="${totalAlunos}">0</strong></p>
            <p>
                <a class="botao" th:href="@{/alunos}">Ver alunos</a>
                <a class="botao botao-secundario" th:href="@{/relatorio}">Relatório geral</a>
            </p>
        </div>
    </main>
</body>
</html>
