<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Desempenho')}"></head>
<body>
    <header th:replace="~{fragments/layout :: cabecalho}"></header>

    <main>
        <h1>Desempenho acadêmico</h1>

        <div class="card">
            <p><strong>Aluno:</strong> <span th:text="${desempenho.aluno().nome}">Nome</span></p>
            <p><strong>Notas:</strong> <span th:text="${desempenho.aluno().notas}">[]</span></p>
            <p><strong>Média:</strong>
                <span th:text="${#numbers.formatDecimal(desempenho.media(), 1, 2)}">0,00</span></p>
            <p><strong>Situação:</strong>
                <span class="selo"
                      th:classappend="${'selo-' + #strings.toLowerCase(desempenho.situacao().name())}"
                      th:text="${desempenho.situacao().descricao}">Aprovado</span></p>
        </div>

        <p><a class="botao botao-secundario" th:href="@{/alunos}">Voltar à lista</a></p>
    </main>
</body>
</html>
